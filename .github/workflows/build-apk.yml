name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the signed APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/UniverseExplorer-build-${{ github.run_number }}.apk"
          ls -la out

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniverseExplorer-build-${{ github.run_number }}
          path: out/*.apk

      - name: Publish a GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
            Download the APK below and install it over the previous version.
          files: out/*.apk
          make_latest: true
