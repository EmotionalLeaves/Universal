name: UI test (emulator)

# Builds the APK, runs it in an Android emulator, drives it with taps and swipes
# (tools/ui_test.sh) and keeps a screenshot of every step as an artifact.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Add app data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets
          gh release download data-v1 -p base-data.zip -D /tmp/data
          unzip -qo /tmp/data/base-data.zip -d app/src/main/assets
          # AT-HYG (750,000 real stars) ships inside the app too.
          gh release download data-v1 -p pack-stars-athyg.zip -D /tmp/data && unzip -qo /tmp/data/pack-stars-athyg.zip -d app/src/main/assets/stars || true

      - name: Build the APK
        run: |
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk app.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tools/ui_test.sh app.apk

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test
          path: ui-test/

      - name: Publish screenshots to the ui-test release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ui-test && zip -qr ../ui-test.zip . && cd ..
          gh release view ui-test >/dev/null 2>&1 || gh release create ui-test --title "UI test screenshots" --notes "Latest emulator UI test run." --latest=false --prerelease
          gh release upload ui-test ui-test.zip --clobber
