name: Probe data sources
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          head_url() { echo "== $1"; curl -sSIL --max-time 40 "$1" | grep -iE "^(HTTP|content-length|content-type|location)" | tail -4; }
          echo "#### HYG media"
          for f in hyg/media/branch/main/data/hyg/CURRENT/hyg_v44.csv.gz athyg/media/branch/main/data/subsets/hyglike_from_athyg_v40.csv.gz athyg/media/branch/main/data/subsets/athyg_40_reduced_m10.csv.gz athyg/media/branch/main/data/subsets/athyg_40_reduced_m11.csv.gz athyg/media/branch/main/data/athyg_40.csv.gz; do head_url https://codeberg.org/astronexus/$f; done
          curl -sSL --max-time 120 https://codeberg.org/astronexus/hyg/media/branch/main/data/hyg/CURRENT/hyg_v44.csv.gz | gunzip | head -3
          curl -sSL --max-time 120 https://codeberg.org/astronexus/athyg/media/branch/main/data/subsets/athyg_40_reduced_m10.csv.gz | gunzip | head -3
          curl -sSL --max-time 120 https://codeberg.org/astronexus/hyg/media/branch/main/data/hyg/CURRENT/hyg_v44.csv.gz | gunzip | wc -l
          echo "#### Exoplanets"
          curl -sS --max-time 90 "https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+top+3+pl_name,hostname,pl_orbsmax,pl_rade,pl_bmasse,pl_orbper,pl_orbeccen,pl_orbincl,pl_eqt,ra,dec,sy_dist,st_teff,st_rad,st_mass,st_lum,hd_name,hip_name,gaia_id,sy_pnum+from+pscomppars&format=csv"
          curl -sS --max-time 90 "https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+count(*)+from+pscomppars&format=csv"
          curl -sS --max-time 90 "https://exoplanetarchive.ipac.caltech.edu/TAP/sync?query=select+pl_name,sy_dist,pl_orbsmax+from+pscomppars+where+hostname='TRAPPIST-1'&format=csv"
          echo "#### VizieR"
          head_url "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJ/944/94&-out.max=3&-out.all"
          curl -sS --max-time 60 "https://vizier.cds.unistra.fr/viz-bin/asu-tsv?-source=J/ApJ/944/94&-out.max=3&-out.all" | head -60
          curl -sS --max-time 60 "https://vizier.cfa.harvard.edu/viz-bin/asu-tsv?-source=J/ApJ/944/94&-out.max=3&-out.all" | head -30
          echo "#### GLADE page"
          curl -sS --max-time 30 https://glade.elte.hu | grep -iE "txt|hdf|zip|download|GLADE\+" | grep -oiE 'href="[^"]+"' | sort -u | head -30
          echo "#### USGS mosaics"
          curl -sS --max-time 40 https://planetarymaps.usgs.gov/mosaic/ | grep -oiE 'href="[^"]+"' | grep -iE "mars|moon|lunar|mercury|venus|earth" | head -60
          echo "#### Wikimedia"
          head_url https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Equirectangular_projection_SW.jpg/640px-Equirectangular_projection_SW.jpg
          echo "#### GitHub texture repos"
          for r in homer-jay/solar-system-textures jeromeetienne/threex.planets; do echo "== $r"; gh api "repos/$r/git/trees/HEAD?recursive=1" --jq '.tree[] | select(.type=="blob") | "\(.path) \(.size)"' | grep -iE "\.(jpg|png)" | head -60; done
          gh api repos/mrdoob/three.js/contents/examples/textures/planets --jq '.[] | "\(.name) \(.size)"'
          echo "#### ETOPO"
          head_url https://www.ngdc.noaa.gov/thredds/fileServer/global/ETOPO2022/60s/60s_surface_elev_netcdf/ETOPO_2022_v1_60s_N90W180_surface.nc
          head_url https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO1/data/ice_surface/grid_registered/georeferenced_tiff/ETOPO1_Ice_g_geotiff.zip
          head_url https://visibleearth.nasa.gov/images/73934/topography
          echo "#### Gaia archive tap"
          curl -sS --max-time 60 "https://gea.esac.esa.int/tap-server/tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=csv&QUERY=SELECT+TOP+2+source_id,ra,dec,parallax,phot_g_mean_mag+FROM+gaiadr3.gaia_source" | head -5
